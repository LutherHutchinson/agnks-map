name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'  # Каждые 1 час
  workflow_dispatch:      # Ручной запуск

# Разрешения для деплоя на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Скачиваем код
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Создаем config.js из секретов репозитория
      - name: Create config.js
        run: |
          echo "const CONFIG = {" > config.js
          echo "    YANDEX_MAPS_API_KEY: '${{ secrets.YANDEX_API_KEY }}'," >> config.js
          echo "    YANDEX_SUGGEST_API_KEY: '${{ secrets.YANDEX_SUGGEST_API_KEY }}'" >> config.js
          echo "};" >> config.js

      # 2c. Загружаем свежие данные Газпрома
      - name: Update Gazprom Station Data
        run: |
          python3 update_stations.py

      # 2b. Диагностика — проверяем, что config.js создан (ключи скрыты)
      - name: Verify config.js (debug)
        run: |
          echo "--- config.js contents ---"
          cat config.js
          echo "--------------------------"

      # 3. Загружаем файлы как артефакт Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # 4. Деплоим
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
