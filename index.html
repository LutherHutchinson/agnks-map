<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>АГНКС Маршруты</title>

    <link rel="stylesheet" href="style.css">

    <!-- Яндекс Карты API -->
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=a5252d11-1c02-407a-9a11-cdcea2a45c23"
        type="text/javascript"></script>

    <!-- Turf.js -->
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

</head>

<body>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div id="controls">
        <h3>Планировщик АГНКС</h3>

        <!-- Ввод маршрута -->
        <div class="input-wrapper">
            <input type="text" id="route-from" placeholder="Откуда (например: Элиста)">
            <button id="my-loc-from" class="my-loc-btn" title="Моё местоположение">📍</button>
        </div>
        <div class="input-wrapper">
            <input type="text" id="route-to" placeholder="Куда (например: Краснодар)">
            <button id="my-loc-to" class="my-loc-btn" title="Моё местоположение">📍</button>
        </div>
        <button id="build-route">Проложить маршрут</button>

        <!-- Строка статуса -->
        <div id="status"></div>

        <!-- Выбранные промежуточные заправки -->
        <div id="route-list-container">
            <div class="route-list-title">Заезды по пути:</div>
            <div id="waypoints-list"></div>

            <a id="launch-nav" href="#" target="_blank" class="final-nav-btn" style="display: none;">
                🚗 ПОЕХАЛИ (Навигатор)
            </a>
        </div>

        <!-- Фильтр видимости заправок -->
        <div class="filter-group">
            <div class="checkbox-group">
                <input type="checkbox" id="show-all" checked>
                <label for="show-all">Показывать все заправки</label>
            </div>

            <div id="distance-slider-group" style="display: none;">
                <label for="distance-slider" class="filter-label">
                    Искать не дальше: <strong id="distance-val">15</strong> км от трассы
                </label>
                <input type="range" id="distance-slider" min="1" max="150" value="15" step="1">
            </div>
        </div>

        <!-- Фильтр по удобствам -->
        <div class="filter-group">
            <button class="amenity-filter-toggle" id="amenity-toggle" type="button">
                Фильтр по удобствам <span id="amenity-toggle-arrow">▸</span>
            </button>
            <div id="amenity-filter-panel" style="display:none;">
                <div class="amenity-filter-note">Только для заправок Газпрома</div>

                <div class="amenity-category">Время работы</div>
                <div class="amenity-checkboxes">
                    <label><input type="checkbox" data-amenity="around_the_clock"> 🕐 Круглосуточно</label>
                </div>

                <div class="amenity-category">Оплата</div>
                <div class="amenity-checkboxes">
                    <label><input type="checkbox" data-amenity="payment_sce"> 🪪 Карта ECOGAS</label>
                    <label><input type="checkbox" data-amenity="payment_bc"> 💳 Банковские карты</label>
                    <label><input type="checkbox" data-amenity="payment_c"> � Наличные</label>
                </div>

                <div class="amenity-category">Виды топлива</div>
                <div class="amenity-checkboxes">
                    <label><input type="checkbox" data-amenity="cng"> � КПГ</label>
                    <label><input type="checkbox" data-amenity="lng"> ❄️ СПГ</label>
                </div>

                <div class="amenity-category">Услуги для вас</div>
                <div class="amenity-checkboxes">
                    <label><input type="checkbox" data-amenity="cafe"> ☕ Кафе</label>
                    <label><input type="checkbox" data-amenity="shop"> 🛍️ Магазин</label>
                    <label><input type="checkbox" data-amenity="wc"> 🚻 Туалет</label>
                </div>

                <div class="amenity-category">Услуги для автомобиля</div>
                <div class="amenity-checkboxes">
                    <label><input type="checkbox" data-amenity="charging"> ⚡ Зарядка для электрокаров</label>
                    <label><input type="checkbox" data-amenity="washing"> 🚗 Автоматическая мойка</label>
                    <label><input type="checkbox" data-amenity="tire_inflation"> 🔧 Подкачка шин</label>
                </div>

                <button id="reset-amenity-filters" type="button" class="reset-filters-btn">✕ Сбросить фильтры</button>
            </div>
        </div>
    </div>

    <!-- КАРТА -->
    <div id="map"></div>

    <script src="app.js?v=2"></script>

</body>

</html>
